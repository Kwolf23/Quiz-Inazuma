    let indicesDisponibles = jugadores.map((_, i) => i);
    let actual = obtenerSiguienteIndice();
    let errores = 0;
    let aciertos = 0;
    let intentos = 0;

    function actualizarContador() {
      document.getElementById("contador").textContent = `Aciertos: ${aciertos} | Errores: ${errores} de 60`;
    }

    function obtenerSiguienteIndice() {
      if (indicesDisponibles.length === 0) {
        indicesDisponibles = jugadores.map((_, i) => i);
      }
      const aleatorio = Math.floor(Math.random() * indicesDisponibles.length);
      return indicesDisponibles.splice(aleatorio, 1)[0];
    }

    function mostrarJugador() {
      document.getElementById("jugadorImg").src = jugadores[actual].img;
      document.getElementById("respuesta").value = "";
      document.getElementById("resultado").innerText = "";
      intentos = 0;
    }

    function verificarNombre() {
      const entrada = document.getElementById("respuesta").value.trim().toLowerCase();
      const correcto = jugadores[actual].nombre.toLowerCase();
      const resultado = document.getElementById("resultado");

      if (entrada === correcto) {
        document.getElementById("sonidoAcierto").play();$1aciertos++;
        actualizarContador();
        actual = obtenerSiguienteIndice();
        setTimeout(mostrarJugador, 1000);
      } else {
        intentos++;
        document.getElementById("sonidoFallo").play();
        if (intentos >= 2) {
          resultado.innerText = `Incorrecto. La respuesta era: ${jugadores[actual].nombre}`;
          resultado.className = "incorrecto";
          errores++;
          actualizarContador();
          actual = obtenerSiguienteIndice();
          setTimeout(mostrarJugador, 2000);
        } else {
          resultado.innerText = "Incorrecto. Intenta de nuevo.";
          resultado.className = "incorrecto";
        }
      }
    }

    function mostrarSugerencias() {
      const input = document.getElementById("respuesta");
      const container = document.getElementById("sugerenciasContainer");
      const texto = input.value.toLowerCase();
      container.innerHTML = "";

      if (texto.length === 0) {
        container.style.display = "none";
        return;
      }

      const sugerencias = jugadores.filter(j => j.nombre.toLowerCase().includes(texto)).slice(0, 5);
      sugerencias.forEach(j => {
        const div = document.createElement("div");
        div.className = "sugerencia";
        div.textContent = j.nombre;
        div.onclick = () => {
          input.value = j.nombre;
          container.style.display = "none";
        };
        container.appendChild(div);
      });

      container.style.display = sugerencias.length > 0 ? "block" : "none";
    }

    function ocultarSugerencias() {
      setTimeout(() => {
        document.getElementById("sugerenciasContainer").style.display = "none";
      }, 200);
    }

    mostrarJugador();
    actualizarContador();
